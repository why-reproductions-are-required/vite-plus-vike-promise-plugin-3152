name: Reproduction

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check Promise plugin metadata
        run: pnpm test
      - name: Build with Vite+ defineConfig
        if: ${{ !cancelled() }}
        run: pnpm build
      - name: Build with Vite defineConfig (control)
        if: ${{ !cancelled() }}
        run: pnpm build:control
